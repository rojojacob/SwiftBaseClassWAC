# Lefthook git hooks — all enforcement routes through the one `gate` binary.
# Install once after cloning:  lefthook install
# Docs: https://lefthook.dev

pre-commit:
  parallel: false
  commands:
    # 1. Auto-fix formatting on the STAGED Swift files only (not the whole repo,
    #    so a commit never sweeps up unrelated reformatted files), then re-stage.
    format:
      glob: "*.swift"
      run: swiftformat {staged_files}
      stage_fixed: true
    # 2. Strict lint on the staged files (warnings are errors).
    lint:
      glob: "*.swift"
      run: swiftlint lint --strict {staged_files}
    # 3. The new capability: scoped UNIT tests for the screens with staged changes
    #    (UI excluded — kept fast). Routes through gate; a non-feature change is a no-op.
    unit:
      glob: "*.swift"
      run: ./gate staged --no-ui

commit-msg:
  commands:
    conventional:
      run: bash scripts/check-commit-msg.sh {1}

pre-push:
  commands:
    # Last line before code leaves the machine: affected screens, unit + UI.
    gate-branch:
      run: ./gate branch
