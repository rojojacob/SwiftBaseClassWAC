name: iOS CI

# Cheap checks first, expensive build last — fail fast so a broken build
# never reaches the upload/archive step.

on:
  pull_request:
  push:
    branches: [main, Develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: "SwiftBaseClassWAC"
  PROJECT: "SwiftBaseClassWAC/SwiftBaseClassWAC.xcodeproj"

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint (strict)
        run: swiftlint lint --strict

  test:
    name: Build & Test
    needs: lint            # gate the expensive job behind the cheap one
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::Xcode 26 not found on the runner. Available Xcodes:"
            ls -d /Applications/Xcode_*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Pick an available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import sys, json; ds = [d for r in json.load(sys.stdin)['devices'].values() for d in r if d.get('isAvailable') and d['name'].startswith('iPhone')]; print(ds[0]['udid'] if ds else '')")
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on the runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_ID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator $UDID"

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT"

      - name: Unit & UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify || (echo "::error::Tests failed"; exit 1)

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult

  archive:
    name: Archive (.ipa)
    needs: test            # only archive once tests are green
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Develop'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # Signing & upload are handled by fastlane in the `beta` lane.
      # In CI you would inject signing assets via `fastlane match` and run:
      #   bundle exec fastlane beta
      # Kept as an unsigned archive here so the pipeline is runnable without secrets.
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -archivePath build/SwiftBaseClassWAC.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
