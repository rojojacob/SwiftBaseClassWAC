name: iOS CI

# Cheap checks first, expensive build last — fail fast so a broken build
# never reaches the upload/archive step.

on:
  pull_request:
  push:
    branches: [main, Develop, "feat/**", "fix/**"]
  workflow_dispatch:        # run the full pipeline on demand against ANY branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: "SwiftBaseClassWAC"
  PROJECT: "SwiftBaseClassWAC/SwiftBaseClassWAC.xcodeproj"

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint (strict)
        run: swiftlint lint --strict

  test:
    name: Build & Test
    needs: lint            # gate the expensive job behind the cheap one
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Cache SwiftPM & DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            Tooling/.build
          key: ${{ runner.os }}-spm-dd-${{ hashFiles('Tooling/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-dd-

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::Xcode 26 not found on the runner. Available Xcodes:"
            ls -d /Applications/Xcode_*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Pick an available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import sys, json; ds = [d for r in json.load(sys.stdin)['devices'].values() for d in r if d.get('isAvailable') and d['name'].startswith('iPhone')]; print(ds[0]['udid'] if ds else '')")
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on the runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_ID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator $UDID"

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT"

      - name: Unit & UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify || (echo "::error::Tests failed"; exit 1)

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult

  archive:
    name: Archive (.ipa)
    needs: test            # only archive once tests are green
    # Archive runs on: a manual dispatch (any branch), or a push to main/Develop.
    # It is intentionally skipped on pull_request events, where github.ref is
    # refs/pull/N/merge — dispatch the branch directly to archive a PR branch.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/Develop'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # Signing & upload are handled by fastlane in the `beta` lane.
      # In CI you would inject signing assets via `fastlane match` and run:
      #   bundle exec fastlane beta
      # Kept as an unsigned archive here so the pipeline is runnable without secrets.
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -archivePath build/SwiftBaseClassWAC.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

  fast-check:
    name: Fast scoped gate (PR)
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    # Informational only — the `test` job above is the source of truth. This job
    # runs the scoped gate (which includes a simulator test stage) as a fast
    # preview; never let its env-sensitivity (simulator availability) block a PR,
    # so do NOT add it to required status checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # gate branch needs history to diff against the base
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::Xcode 26 not found on the runner."
            ls -d /Applications/Xcode_*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Install SwiftLint & SwiftFormat
        run: brew install swiftlint swiftformat
      - name: Scoped gate for changed screens
        run: ./gate branch --base "origin/${{ github.base_ref }}"

  audit:
    name: Audit (informational)
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    continue-on-error: true        # never blocks a PR (informational, per the standard)
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint & SwiftFormat
        run: brew install swiftlint swiftformat
      - name: gate audit (annotate + report)
        run: ./gate audit --annotate --report GATE_REPORT.md
      - name: Upload GATE_REPORT.md
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-report
          path: GATE_REPORT.md
