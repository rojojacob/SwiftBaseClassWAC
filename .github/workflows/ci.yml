name: iOS CI

# Cheap checks first, expensive build last — fail fast so a broken build
# never reaches the upload/archive step.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: "SwiftBaseClassWAC"
  PROJECT: "SwiftBaseClassWAC/SwiftBaseClassWAC.xcodeproj"
  # A simulator that exists on the runner image; adjust if the image changes.
  DESTINATION: "platform=iOS Simulator,name=iPhone 16"

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint (strict)
        run: swiftlint lint --strict

  test:
    name: Build & Test
    needs: lint            # gate the expensive job behind the cheap one
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || true

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT"

      - name: Unit & UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify || (echo "::error::Tests failed"; exit 1)

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult

  archive:
    name: Archive (.ipa)
    needs: test            # only archive once tests are green
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Signing & upload are handled by fastlane in the `beta` lane.
      # In CI you would inject signing assets via `fastlane match` and run:
      #   bundle exec fastlane beta
      # Kept as an unsigned archive here so the pipeline is runnable without secrets.
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -archivePath build/SwiftBaseClassWAC.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
