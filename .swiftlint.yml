# SwiftLint configuration
# Docs: https://realm.github.io/SwiftLint/rule-directory.html
# Run locally:  swiftlint            (lint)
#               swiftlint --strict   (CI / pre-commit: warnings become errors)

disabled_rules:
  - trailing_whitespace        # handled by SwiftFormat

opt_in_rules:
  # ── existing ──
  - empty_count
  - force_unwrapping
  - explicit_init
  - first_where
  - contains_over_filter_count
  - last_where
  - sorted_first_last
  - toggle_bool
  - redundant_nil_coalescing
  - closure_spacing
  - operator_usage_whitespace
  - vertical_whitespace_closing_braces
  - multiline_arguments
  # ── Phase 2B: stricter standard ──
  # omitted: file_name — flags AppTheme.swift, OnFirstAppear.swift, ErrorAlert.swift,
  #   HTTPStatus.swift, Codable+RawRepresentable.swift (multi-type / extension-pattern files
  #   throughout app + Tooling); file_name.excluded can't exclude by file path, only by
  #   type-name pattern, so there is no non-disruptive way to keep it green without
  #   splitting/renaming every intentionally grouped file.
  - fatal_error_message           # fatalError must explain why
  - empty_string                  # `x.isEmpty` not `x == ""`
  - empty_collection_literal      # `x.isEmpty` not `x == []`
  - flatmap_over_map_reduce
  - joined_default_parameter
  - legacy_random
  - lower_acl_than_parent
  - modifier_order                # consistent @MainActor/public/final ordering
  - prefer_self_in_static_references
  - redundant_type_annotation
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition
  - implicitly_unwrapped_optional # no `T!` ivars
  - private_action
  - private_outlet
  - overridden_super_call
  - prohibited_super_call

analyzer_rules:
  - unused_declaration
  - unused_import

excluded:
  - .build
  - "**/.build"          # nested SwiftPM build dirs (e.g. Tooling/.build) — never lint vendored deps
  - DerivedData
  - "**/Generated"
  - fastlane
  - vendor
  - Pods
  - Carthage

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
    - to
    - vm

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

custom_rules:
  no_print:
    name: "Use AppLogger, not print"
    included: ".*/SwiftBaseClassWAC/SwiftBaseClassWAC/.*\\.swift"
    regex: "\\bprint\\("
    match_kinds:
      - identifier
    message: "Use AppLogger instead of print() in app code."
    severity: error
  view_no_networking:
    name: "View has no networking/DI"
    included: ".*View\\.swift"
    excluded: ".*Tests.*"
    regex: "\\b(APIClient|URLSession|Dependencies\\.live)\\b"
    message: "Views must not touch networking or the DI container directly — go through a ViewModel."
    severity: error
  viewmodel_no_swiftui:
    name: "ViewModel is UI-framework-free"
    included: ".*ViewModel\\.swift"
    excluded: ".*Tests.*"
    regex: "^import +SwiftUI"
    message: "View models must not import SwiftUI — keep presentation logic UI-agnostic (use Observation)."
    severity: error

reporter: "xcode"
